name: Keep FastAPI Warm

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes (UTC)
  workflow_dispatch: {}

jobs:
  ping-fastapi:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI health endpoint
        run: |
          echo "Pinging deployed FastAPI health endpoint..."
          curl -fsS https://fast-api-g456.onrender.com/health
          echo "Ping succeeded"
